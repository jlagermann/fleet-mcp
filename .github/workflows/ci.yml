name: ci

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      # Uses the toolchain directive in go.mod, so CI, local builds and
      # staticcheck all agree on one Go version.
      - uses: actions/setup-go@v5
        with:
          go-version-file: go.mod

      - name: Format
        run: test -z "$(gofmt -l .)" || { gofmt -l .; exit 1; }

      - name: Vet
        run: go vet ./...

      - name: Test
        run: go test -race ./...

      # staticcheck 0.8.1 cannot read go1.27.x export data (version 5) yet;
      # analyze with go1.27.1 until a release supports it. Build, test and
      # govulncheck still use the go.mod toolchain.
      - name: Staticcheck
        env:
          GOTOOLCHAIN: go1.27.1
        run: go run honnef.co/go/tools/cmd/staticcheck@latest ./...

      - name: Govulncheck
        run: go run golang.org/x/vuln/cmd/govulncheck@latest ./...

      - name: Build
        run: |
          GOOS=linux   GOARCH=amd64 go build -o /dev/null ./cmd/fleet-mcp
          GOOS=windows GOARCH=amd64 go build -o /dev/null ./cmd/fleet-mcp
          GOOS=darwin  GOARCH=arm64 go build -o /dev/null ./cmd/fleet-mcp
