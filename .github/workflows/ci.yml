name: ci

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      # Uses the toolchain directive in go.mod, so CI, local builds and
      # staticcheck all agree on one Go version.
      - uses: actions/setup-go@v5
        with:
          go-version-file: go.mod

      - name: Vet
        run: go vet ./...

      - name: Test
        run: go test -race ./...

      - name: Staticcheck
        run: go run honnef.co/go/tools/cmd/staticcheck@latest ./...

      - name: Govulncheck
        run: go run golang.org/x/vuln/cmd/govulncheck@latest ./...

      - name: Build
        run: |
          GOOS=linux   GOARCH=amd64 go build -o /dev/null ./cmd/fleet-mcp
          GOOS=windows GOARCH=amd64 go build -o /dev/null ./cmd/fleet-mcp
          GOOS=darwin  GOARCH=arm64 go build -o /dev/null ./cmd/fleet-mcp
